# Checks on every push to main and every pull request, also startable by hand (Actions >
# CI > Run workflow). Back on automatic since 2026-10-29: started by hand only, it missed
# G-code that differed on Windows until a release build. The toolchain comes from
# rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The compiled dependencies, with a fallback when Cargo.lock changes (a version bump
      # missed the old cache and rebuilt everything); our own crates are built each time.
      - uses: Swatinem/rust-cache@v2
      # Ready-made binaries: compiling them took almost 4 minutes on a cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Property-test cases that failed (commit them with the fix)
        if: failure()
        shell: bash
        run: |
          for f in $(git ls-files -m -o -- '*.proptest-regressions'); do echo "== $f"; cat "$f"; done
      - name: The libraries still compile for the browser (docs/specs/web.md)
        run: >
          cargo check --locked --target wasm32-unknown-unknown
          -p chipload-core -p chipload-job -p chipload-dxf -p chipload-image -p chipload-text -p chipload-draw -p chipload-toolpath
          -p chipload-post -p chipload-check -p chipload-pipeline
      - run: cargo deny check licenses bans sources
      - name: Third-party notices are up to date
        run: |
          cargo about generate --fail about.hbs > THIRD-PARTY-LICENSES.txt
          git diff --exit-code THIRD-PARTY-LICENSES.txt || {
            echo "::error::THIRD-PARTY-LICENSES.txt is stale: run 'cargo about generate --fail about.hbs > THIRD-PARTY-LICENSES.txt' and commit it"
            exit 1
          }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Property-test cases that failed (commit them with the fix)
        if: failure()
        shell: bash
        run: |
          for f in $(git ls-files -m -o -- '*.proptest-regressions'); do echo "== $f"; cat "$f"; done
