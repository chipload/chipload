# Checks on every push and pull request. The toolchain comes from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  CARGO_ABOUT_VERSION: 0.9.2

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
            ~/.cargo/registry
            target
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Tools
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          command -v cargo-about || cargo install --locked cargo-about --version "$CARGO_ABOUT_VERSION" --features cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Property-test cases that failed (commit them with the fix)
        if: failure()
        shell: bash
        run: |
          for f in $(git ls-files -m -o -- '*.proptest-regressions'); do echo "== $f"; cat "$f"; done
      - name: The libraries still compile for the browser (docs/specs/web.md)
        run: >
          cargo check --locked --target wasm32-unknown-unknown
          -p chipload-core -p chipload-job -p chipload-dxf -p chipload-image -p chipload-toolpath
          -p chipload-post -p chipload-check -p chipload-pipeline
      - run: cargo deny check licenses bans sources
      - name: Third-party notices are up to date
        run: |
          cargo about generate --fail about.hbs > THIRD-PARTY-LICENSES.txt
          git diff --exit-code THIRD-PARTY-LICENSES.txt || {
            echo "::error::THIRD-PARTY-LICENSES.txt is stale: run 'cargo about generate --fail about.hbs > THIRD-PARTY-LICENSES.txt' and commit it"
            exit 1
          }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Property-test cases that failed (commit them with the fix)
        if: failure()
        shell: bash
        run: |
          for f in $(git ls-files -m -o -- '*.proptest-regressions'); do echo "== $f"; cat "$f"; done
