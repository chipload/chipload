<?xml version="1.0" encoding="UTF-8"?>
<!-- A badge drawn as Inkscape writes it: a page in mm, two layers, curves, a text.
     Written by hand for Chipload's tests (docs/specs/svg-import.md §11). -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="120mm" height="80mm" viewBox="0 0 120 80">
  <sodipodi:namedview id="view" inkscape:document-units="mm"/>
  <g id="layer1" inkscape:groupmode="layer" inkscape:label="Outline">
    <rect id="outline" x="10" y="10" width="100" height="60" rx="8"
          style="fill:none;stroke:#000000;stroke-width:0.5"/>
  </g>
  <g id="layer2" inkscape:groupmode="layer" inkscape:label="Pocket"
     transform="translate(60 40)">
    <path id="leaf" style="fill:#0000ff;stroke:none"
          d="M -25 0 C -15 -18 15 -18 25 0 C 15 18 -15 18 -25 0 Z"/>
    <circle id="eye" cx="-12" cy="0" r="3" style="fill:#0000ff"/>
  </g>
  <g id="layer3" inkscape:groupmode="layer" inkscape:label="Notes">
    <text id="note" x="12" y="76" style="font-size:4px">BADGE</text>
  </g>
</svg>
