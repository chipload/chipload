[package]
name = "chipload-post"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-job = { version = "0.21.0", path = "../chipload-job" }
chipload-toolpath = { version = "0.21.0", path = "../chipload-toolpath" }
minijinja = { version = "3.0.0", features = ["serde", "fuel"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
# The config's JSON Schema, for the user guide's reference (docs/specs/user-guide.md §4).
schemars = { version = "1.2.3", optional = true }

[features]
schema = ["dep:schemars", "chipload-job/schema"]

[lints]
workspace = true

[dev-dependencies]
chipload-check = { path = "../chipload-check" }
