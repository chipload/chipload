# Mach3 and Mach4. Persisted format: see crates/chipload-post/src/lib.rs (ADR 0003, 0007);
# docs/specs/user-posts.md §5.
schema_version = 1
name = "Mach3/4"
template = "mach3.tap.j2"
decimals = 3
inch_decimals = 4
# G21 and G20: the template writes {{ units_word }} (docs/specs/inch-units.md §4.2)
units = ["mm", "inch"]
file_extension = ".tap"
spindle_dwell_s = 3  # written as seconds; see the template's header note
arcs = true  # G2/G3 with I/J relative to the start (G91.1 overrides Mach's IJ setting)
# One file per tool, as for LinuxCNC.
tool_changes = ["files"]
# Shown on the setup sheet (the template says the same in each program).
note = "Not yet tested on a real Mach3 or Mach4 machine: check the program and air-cut first."
