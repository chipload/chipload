[package]
name = "chipload-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "chipload"
path = "src/main.rs"

[dependencies]
chipload-check = { version = "0.19.0", path = "../chipload-check" }
chipload-core = { version = "0.19.0", path = "../chipload-core" }
chipload-dxf = { version = "0.19.0", path = "../chipload-dxf" }
chipload-pipeline = { version = "0.19.0", path = "../chipload-pipeline" }
chipload-post = { version = "0.19.0", path = "../chipload-post", features = ["schema"] }
chipload-toolpath = { version = "0.19.0", path = "../chipload-toolpath" }
chipload-job = { version = "0.19.0", path = "../chipload-job", features = ["schema"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.3"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
# Validates the generated JSON Schemas against the corpus (tests only; docs/specs/scripting.md §7).
boon = "0.6.1"
