[package]
name = "chipload-dxf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
cavalier_contours = "0.9.0"
chipload-core = { version = "0.29.1", path = "../chipload-core" }
chipload-i18n = { version = "0.29.1", path = "../chipload-i18n" }
chipload-job = { version = "0.29.1", path = "../chipload-job" }
chipload-svg = { version = "0.29.1", path = "../chipload-svg" }
dxf = "0.6.2"
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

# Browser builds only (docs/specs/web.md): the dxf crate's uuid needs a randomness source there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.26.1", features = ["js"] }
