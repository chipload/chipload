[package]
name = "chipload-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "chipload-gui"
path = "src/main.rs"

[dependencies]
chipload-core = { version = "0.27.1", path = "../chipload-core" }
chipload-draw = { version = "0.27.1", path = "../chipload-draw" }
chipload-dxf = { version = "0.27.1", path = "../chipload-dxf" }
chipload-i18n = { version = "0.27.1", path = "../chipload-i18n" }
chipload-job = { version = "0.27.1", path = "../chipload-job" }
chipload-pipeline = { version = "0.27.1", path = "../chipload-pipeline" }
chipload-text = { version = "0.27.1", path = "../chipload-text" }
chipload-toolpath = { version = "0.27.1", path = "../chipload-toolpath" }
# No "default_fonts": egui's bundled fonts are OFL/Ubuntu-font licensed; the GUI loads
# installed system fonts instead (decision 2026-10-09).
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
rfd = "0.17.2"
serde_json = "1"
# The system's language, for the app's default language (docs/specs/translations.md decision
# 5): on Windows and macOS it takes the system API, which forbid(unsafe_code) rules out here.
# MIT OR Apache-2.0.
sys-locale = "0.3.2"
# Only to pick the window frame: winit's fallback frame (what eframe gets without its default
# features) makes WSLg's compositor drop the connection while resizing; the adwaita frame
# (winit's own default) is fine. See ADR 0008.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
# Runs the app headless in tests: layout checks through AccessKit, and pictures of it
# rendered with wgpu (snapshot). MIT OR Apache-2.0, egui's own test library; tests only.
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }

[features]
# Screenshots for the user guide (packaging/docs/screenshots.sh): eframe saves the first
# frame, and CHIPLOAD_SCREENSHOT_SETUP sets up what it shows. Never in release builds.
screenshots = ["eframe/__screenshot"]

[lints]
workspace = true

# The icon inside chipload-gui.exe (packaging/brand/), compiled in on Windows only. MIT.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
