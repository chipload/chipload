[package]
name = "chipload-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "chipload-gui"
path = "src/main.rs"

[dependencies]
chipload-core = { version = "0.30.0", path = "../chipload-core" }
chipload-draw = { version = "0.30.0", path = "../chipload-draw" }
chipload-dxf = { version = "0.30.0", path = "../chipload-dxf" }
chipload-i18n = { version = "0.30.0", path = "../chipload-i18n" }
chipload-job = { version = "0.30.0", path = "../chipload-job" }
chipload-pipeline = { version = "0.30.0", path = "../chipload-pipeline" }
chipload-text = { version = "0.30.0", path = "../chipload-text" }
chipload-toolpath = { version = "0.30.0", path = "../chipload-toolpath" }
# No "default_fonts": egui's bundled fonts are OFL/Ubuntu-font licensed; the GUI loads
# installed system fonts instead (decision 2026-10-09).
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
rfd = "0.17.2"
serde_json = "1"
# The system's language, for the app's default language (docs/specs/translations.md decision
# 5): on Windows and macOS it takes the system API, which forbid(unsafe_code) rules out here.
# MIT OR Apache-2.0.
sys-locale = "0.3.2"
# The update notice's one HTTPS request (docs/specs/update-notice.md, ADR 0026): ureq
# (MIT OR Apache-2.0) over rustls (Apache-2.0 OR ISC OR MIT) with ring (Apache-2.0 AND ISC),
# checked against the system's own certificates, loaded by rustls-native-certs (Apache-2.0
# OR ISC OR MIT). Not ureq's default features: they bundle webpki-roots, and its
# platform-verifier brings webpki-root-certs for wasm32 (both CDLA-Permissive-2.0, not
# allowed).
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8.5"
# Only to pick the window frame: winit's fallback frame (what eframe gets without its default
# features) makes WSLg's compositor drop the connection while resizing; the adwaita frame
# (winit's own default) is fine. See ADR 0008.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
# Runs the app headless in tests: layout checks through AccessKit, and pictures of it
# rendered with wgpu (snapshot). MIT OR Apache-2.0, egui's own test library; tests only.
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }

[lints]
workspace = true

# The icon inside chipload-gui.exe (packaging/brand/), compiled in on Windows only. MIT.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
