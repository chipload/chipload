[package]
name = "chipload-job"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-core = { version = "0.27.1", path = "../chipload-core" }
chipload-i18n = { version = "0.27.1", path = "../chipload-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parse every f64 exactly as written. The default parser can be off in the
# last bit, and a project must reload exactly the geometry it saved.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# JSON Schemas of the persisted formats (docs/specs/scripting.md §2), for the CLI only.
schemars = { version = "1.2.3", optional = true }

[features]
schema = ["dep:schemars"]

[lints]
workspace = true
