[package]
name = "chipload-job"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-core = { version = "0.10.0", path = "../chipload-core" }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parse every f64 exactly as written. The default parser can be off in the
# last bit, and a project must reload exactly the geometry it saved.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[lints]
workspace = true
