[package]
name = "chipload-text"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-core = { version = "0.27.1", path = "../chipload-core" }
chipload-i18n = { version = "0.27.1", path = "../chipload-i18n" }
# Reads the built-in fonts' outlines and kerning. MIT OR Apache-2.0, already in the tree
# through egui (docs/specs/text.md §4).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout"] }

[lints]
workspace = true
