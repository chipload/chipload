[package]
name = "chipload-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-check = { version = "0.30.0", path = "../chipload-check" }
chipload-core = { version = "0.30.0", path = "../chipload-core" }
chipload-draw = { version = "0.30.0", path = "../chipload-draw" }
chipload-dxf = { version = "0.30.0", path = "../chipload-dxf" }
chipload-i18n = { version = "0.30.0", path = "../chipload-i18n" }
chipload-image = { version = "0.30.0", path = "../chipload-image" }
chipload-text = { version = "0.30.0", path = "../chipload-text" }
chipload-job = { version = "0.30.0", path = "../chipload-job" }
chipload-post = { version = "0.30.0", path = "../chipload-post" }
chipload-toolpath = { version = "0.30.0", path = "../chipload-toolpath" }
# The simulation image (docs/specs/simulation.md §6); MIT OR Apache-2.0, already in the
# tree through eframe.
png = "0.18.1"
# Pictures embedded in projects (docs/specs/image-trace.md §4); MIT OR Apache-2.0, already
# in the tree.
base64 = "0.22.1"
serde_json = "1"
sha2 = "0.10"

# The computer's fonts for texts (docs/specs/system-fonts.md decision 7); MIT. Without its
# memory-mapping feature (`unsafe`, and a file changed underneath could crash the app). Not
# in the browser build, which has the built-in fonts only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }

[lints]
workspace = true

[dev-dependencies]
chipload-dxf = { path = "../chipload-dxf" }
proptest = "1"
