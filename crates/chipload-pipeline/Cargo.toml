[package]
name = "chipload-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
chipload-check = { version = "0.17.0", path = "../chipload-check" }
chipload-core = { version = "0.17.0", path = "../chipload-core" }
chipload-dxf = { version = "0.17.0", path = "../chipload-dxf" }
chipload-image = { version = "0.17.0", path = "../chipload-image" }
