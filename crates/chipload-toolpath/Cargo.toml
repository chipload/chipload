[package]
name = "chipload-toolpath"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# BSL-1.0: segment Voronoi diagrams for V-carving (ADR 0015).
boostvoronoi = "0.12.1"
cavalier_contours = "0.9.0"
chipload-core = { version = "0.28.0", path = "../chipload-core" }
chipload-job = { version = "0.28.0", path = "../chipload-job" }
chipload-i18n = { version = "0.28.0", path = "../chipload-i18n" }

[lints]
workspace = true

[dev-dependencies]
cavalier_contours = "0.9.0"
proptest = "1"
serde_json = "1"

# Browser builds only (docs/specs/web.md): boostvoronoi's map seeds a random generator, which
# needs getrandom's browser backend (with the cfg in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
