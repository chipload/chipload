[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gncam"
version = "0.0.1"
description = "2.5D CAM for DXF/DWG drawings"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-qt>=4.4", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gncam = "gncam.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gncam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gncam/core"]
plugins = ["pydantic.mypy"]
