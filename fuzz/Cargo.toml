# Fuzzing the DXF importer and the image tracer (cargo-fuzz, needs a nightly toolchain): see fuzz/README.md.
# Not part of the workspace and never shipped.
[package]
name = "chipload-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chipload-dxf = { path = "../crates/chipload-dxf" }
chipload-job = { path = "../crates/chipload-job" }
chipload-image = { path = "../crates/chipload-image" }

[[bin]]
name = "dxf_import"
path = "fuzz_targets/dxf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_trace"
path = "fuzz_targets/image_trace.rs"
test = false
doc = false
bench = false

# Its own workspace: the main one doesn't build it.
[workspace]
