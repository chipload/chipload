[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.29.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Gustav Näslund"]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"  # library code reports through return values, not stdout

# Debug builds keep file and line for our own crates (panics and backtraces still point at
# the line) and no debug info for dependencies: target/ grew to hundreds of GB with full
# debug info everywhere (2026-10-19). They are lightly optimised, with every debug check
# still on: the tests ran 6 min 50 s unoptimised, 1 min 54 s so (the font tests 143 s and
# 26 s; 2026-10-29).
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Dependencies more so: compiled once, then cached.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Test and debug builds run cavalier_contours exactly as release builds do (ADR 0012): its
# internal debug assertions reject valid input that release builds offset correctly.
[profile.dev.package.cavalier_contours]
debug-assertions = false
