# Windows: link the C runtime statically, so chipload-gui.exe and chipload.exe are single
# files that run without the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Browser builds (docs/specs/web.md): getrandom's browser backend is chosen by this cfg.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
